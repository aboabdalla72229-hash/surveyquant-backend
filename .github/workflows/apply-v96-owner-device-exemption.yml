name: Apply SurveyQuant v1.0.96 owner-device exemption to backend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout backend source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Add owner allow-list and identify the running backend
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import sys

          path = Path("server.js")
          if not path.is_file():
              raise SystemExit("ERROR: server.js is not at the repository root. No changes made.")
          s = path.read_text(encoding="utf-8")
          if "const OWNER_DEVICE_IDS = new Set(" in s:
              raise SystemExit("ERROR: Owner-device patch already exists. No duplicate edit made.")

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"ERROR: Expected exactly one match for {label}; found {count}. No commit made.")
              s = s.replace(old, new, 1)

          replace_once(
              "const TRIAL_DAYS = 3;\n",
              """const TRIAL_DAYS = 3;
          // Only exact device IDs listed in Railway's SURVEYQUANT_OWNER_DEVICE_IDS are exempt.
          const OWNER_DEVICE_IDS = new Set(
            (process.env.SURVEYQUANT_OWNER_DEVICE_IDS || '')
              .split(',')
              .map(value => value.trim())
              .filter(Boolean)
          );
          const OWNER_ACCESS_UNTIL = '2099-12-31T23:59:59.000Z';

          function isOwnerDevice(deviceId) {
            return OWNER_DEVICE_IDS.has(String(deviceId || '').trim());
          }

          function accessPayload(user, deviceId) {
            const ownerExempt = isOwnerDevice(deviceId);
            const now = Date.now();
            return {
              ...user,
              ownerExempt,
              trialActive:
                ownerExempt ||
                (!!user.trialUntil && new Date(user.trialUntil).getTime() > now),
              subscriptionActive:
                ownerExempt ||
                (!!user.activeUntil && new Date(user.activeUntil).getTime() > now),
              trialUntil: ownerExempt ? OWNER_ACCESS_UNTIL : user.trialUntil,
              activeUntil: ownerExempt ? OWNER_ACCESS_UNTIL : user.activeUntil
            };
          }
          """,
              "trial/owner configuration"
          )

          replace_once(
              "app.use(cors());\napp.use(express.json({ limit: '2mb' }));\n\napp.get('/api/config', (req, res) => {\n  res.json({",
              """app.use(cors());
          app.use(express.json({ limit: '2mb' }));

          app.get('/', (_req, res) => {
            res.set('X-SurveyQuant-Backend', 'owner-device-allowlist-v1');
            res.json({
              ok: true,
              service: 'SurveyQuant backend',
              revision: 'owner-device-allowlist-v1',
              endpoints: ['/health', '/api/config', '/api/register', '/api/status/:deviceId']
            });
          });

          app.get('/api/config', (req, res) => {
            res.set('X-SurveyQuant-Backend', 'owner-device-allowlist-v1');
            res.json({""",
              "root/config route marker"
          )

          old_register_status = """  enforceTrialDuration(data.users[key]);
            write(data);
            res.json(data.users[key]);
          });

          app.get('/api/status/:deviceId', (req, res) => {
            const data = read();
            const deviceId = decodeURIComponent(req.params.deviceId);
            const user = data.users['device:' + deviceId];

            if (!user) {
              return res.status(404).json({ error: 'المستخدم غير موجود' });
            }

            enforceTrialDuration(user);
            write(data);

            const now = Date.now();

            res.json({
              ...user,
              trialActive:
                !!user.trialUntil && new Date(user.trialUntil).getTime() > now,
              subscriptionActive:
                !!user.activeUntil && new Date(user.activeUntil).getTime() > now
            });
          });"""
          new_register_status = """  enforceTrialDuration(data.users[key]);
            write(data);
            res.json(accessPayload(data.users[key], normalizedId));
          });

          app.get('/api/status/:deviceId', (req, res) => {
            const data = read();
            const deviceId = decodeURIComponent(req.params.deviceId);
            const key = 'device:' + deviceId;
            let user = data.users[key];

            if (!user && isOwnerDevice(deviceId)) {
              user = data.users[key] = {
                id: crypto.randomUUID(),
                name: '',
                deviceId,
                createdAt: new Date().toISOString(),
                trialUntil: new Date(Date.now() + TRIAL_DAYS * 86400000).toISOString(),
                activeUntil: null
              };
            }

            if (!user) {
              return res.status(404).json({ error: 'المستخدم غير موجود' });
            }

            enforceTrialDuration(user);
            write(data);
            res.json(accessPayload(user, deviceId));
          });"""
          replace_once(old_register_status, new_register_status, "register/status access responses")

          old_create = """app.post('/api/kashier/create-session', async (req, res) => {
            try {
              requireKashierConfig();

              const { deviceId, plan } = req.body || {};
              const normalizedId = String(deviceId || '').trim();
              const key = 'device:' + normalizedId;
              const selectedPlan = PLANS[plan];

              if (!normalizedId || !selectedPlan) {
                return res.status(400).json({
                  error: 'بيانات الحساب أو الباقة غير صحيحة'
                });
              }

              const data = read();"""
          new_create = """app.post('/api/kashier/create-session', async (req, res) => {
            try {
              const { deviceId, plan } = req.body || {};
              const normalizedId = String(deviceId || '').trim();
              const key = 'device:' + normalizedId;
              const selectedPlan = PLANS[plan];

              if (!normalizedId || !selectedPlan) {
                return res.status(400).json({
                  error: 'بيانات الحساب أو الباقة غير صحيحة'
                });
              }

              if (isOwnerDevice(normalizedId)) {
                return res.status(403).json({
                  error: 'هذا الجهاز مستثنى من الاشتراك والدفع',
                  ownerExempt: true,
                  trialActive: true,
                  subscriptionActive: true,
                  activeUntil: OWNER_ACCESS_UNTIL
                });
              }

              requireKashierConfig();
              const data = read();"""
          replace_once(old_create, new_create, "owner checkout protection")

          old_payment_status = """app.get('/api/kashier/status', (req, res) => {
            const deviceId = String(req.query.deviceId || '').trim();
            const order = String(req.query.order || '').trim();

            const data = read();"""
          new_payment_status = """app.get('/api/kashier/status', (req, res) => {
            const deviceId = String(req.query.deviceId || '').trim();
            const order = String(req.query.order || '').trim();

            if (isOwnerDevice(deviceId)) {
              return res.json({
                paymentStatus: 'OWNER_EXEMPT',
                transactionId: null,
                subscriptionActive: true,
                ownerExempt: true,
                activeUntil: OWNER_ACCESS_UNTIL
              });
            }

            const data = read();"""
          replace_once(old_payment_status, new_payment_status, "owner payment-status response")

          old_health = """app.get('/health', (req, res) => {
            res.json({
              ok: true,
              provider: 'Kashier',
              mode: KASHIER_MODE
            });
          });"""
          new_health = """app.get('/health', (req, res) => {
            res.set('X-SurveyQuant-Backend', 'owner-device-allowlist-v1');
            res.json({
              ok: true,
              service: 'SurveyQuant backend',
              revision: 'owner-device-allowlist-v1',
              provider: 'Kashier',
              mode: KASHIER_MODE
            });
          });"""
          replace_once(old_health, new_health, "health revision marker")

          # Guardrails: leave the existing trial and commercial plans unchanged.
          required = [
            "const TRIAL_DAYS = 3;",
            "amount: 55, days: 30, label: 'شهري'",
            "amount: 150, days: 90, label: '3 شهور'",
            "amount: 500, days: 365, label: 'سنوي'",
            "app.get('/api/config'",
            "app.get('/health'",
            "SURVEYQUANT_OWNER_DEVICE_IDS",
            "owner-device-allowlist-v1"
          ]
          missing = [item for item in required if item not in s]
          if missing:
            raise SystemExit("ERROR: post-patch verification failed: " + ", ".join(missing))

          path.write_text(s, encoding='utf-8')
          print("Patched backend while preserving 3-day trial and existing Kashier plans.")
          PY

      - name: Validate server syntax and unchanged plan settings
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          grep -Fq 'const TRIAL_DAYS = 3;' server.js
          grep -Fq "monthly: { amount: 55, days: 30, label: 'شهري' }" server.js
          grep -Fq "quarterly: { amount: 150, days: 90, label: '3 شهور' }" server.js
          grep -Fq "yearly: { amount: 500, days: 365, label: 'سنوي' }" server.js
          git diff --check

      - name: Commit backend patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add v1.0.96 owner-device exemption and backend marker"
          git push
