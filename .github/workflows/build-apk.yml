
name: Repair SurveyQuant Railway source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Check Railway API token
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Missing RAILWAY_API_TOKEN secret."
            echo "Add the token in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Railway token is configured."

      - name: Connect the existing backend service
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway service source connect \
            --repo aboabdalla72229-hash/surveyquant-backend \
            --branch main \
            --service d2bd10f3-2031-4f06-b847-2687776a5ab9 \
            --project 56813f6c-865b-46aa-b9e4-e15094f4b1a0 \
            --environment f691318a-9c83-44ae-a23b-5a3dc9b62a01

      - name: Check backend health
        shell: bash
        run: |
          url="https://surveyquant-backend-production.up.railway.app/health"

          for attempt in $(seq 1 36); do
            body="$(curl -sS --max-time 10 "$url" || true)"

            if echo "$body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "Backend is healthy:"
              echo "$body"
              exit 0
            fi

            echo "Waiting for backend deployment ($attempt/36)..."
            sleep 10
          done

          echo "::error::Backend health check failed. Review Railway deployment logs."
          exit 1

      - name: Verify owner device access
        shell: bash
        run: |
          url="https://surveyquant-backend-production.up.railway.app/api/status/SQ-3149eb5486b3ea3d"
          body="$(curl -sS --max-time 15 "$url" || true)"

          echo "Owner device status:"
          echo "$body"

          if echo "$body" | grep -Eq '"ownerExempt"[[:space:]]*:[[:space:]]*true' &&
             echo "$body" | grep -Eq '"trialActive"[[:space:]]*:[[:space:]]*true' &&
             echo "$body" | grep -Eq '"subscriptionActive"[[:space:]]*:[[:space:]]*true'; then
            echo "Owner device access verified."
          else
            echo "::error::Owner access was not confirmed. Check SURVEYQUANT_OWNER_DEVICE_IDS in Railway Variables."
            exit 1
          fi
